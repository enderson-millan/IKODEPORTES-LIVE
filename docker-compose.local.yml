# IKODEPORTES Live — stack local bajo demanda (PC del operador).
#
# Levanta web + API + Postgres solo mientras se transmite:
#   docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml down
#
# Túnel propio (opcional, perfil "tunnel"):
#   docker compose -f docker-compose.local.yml --profile tunnel up -d --build
#
# IMPORTANTE: un túnel de Cloudflare solo alcanza servicios del host donde corre
# `cloudflared`. El túnel central del servidor NO puede ver contenedores de tu PC.
# Por eso este stack usa un túnel propio y NO se une a `cloudflare_network`.
# Rutas (Cloudflare Zero Trust → Networks → Tunnels → ikodeportes-local):
#   live.ikodeportes.com      -> http://ikodeportes-web:3000
#   api.live.ikodeportes.com  -> http://ikodeportes-api:4000
name: ikodeportes-local

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    container_name: ikodeportes-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    environment:
      POSTGRES_DB: ${DB_NAME:-db_local}
      POSTGRES_USER: ${DB_USER:-ikodeportes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: "America/Caracas"
      PGTZ: "America/Caracas"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ikodeportes} -d ${DB_NAME:-db_local}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  api:
    build:
      context: .
      target: api
    image: ikodeportes/api:local
    container_name: ikodeportes-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    # Solo localhost: el túnel entra por la red interna, no por el host.
    ports:
      - "127.0.0.1:4100:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3100,https://live.ikodeportes.com}
      DATABASE_URL: postgresql://${DB_USER:-ikodeportes}:${DB_PASSWORD}@db:5432/${DB_NAME:-db_local}?schema=public
      FEED_POLL_INTERVAL_MS: ${FEED_POLL_INTERVAL_MS:-5000}
      LEAGUE: ${LEAGUE:-LVBP}
      LVBP_SPORT_ID: ${LVBP_SPORT_ID:-17}
      LVBP_LEAGUE_ID: ${LVBP_LEAGUE_ID:-135}
      LIVE_AUTO_DISCOVER: ${LIVE_AUTO_DISCOVER:-false}
      CONTROL_TOKEN: ${CONTROL_TOKEN:-}
      TZ: "America/Caracas"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *logging

  web:
    build:
      context: .
      target: web
      args:
        # Se incrusta en el build. Para usar solo localhost:
        #   NEXT_PUBLIC_WS_URL=http://localhost:4100 docker compose ... build
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-https://api.live.ikodeportes.com}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    image: ikodeportes/web:local
    container_name: ikodeportes-web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # URL de runtime (server components). Vacío = usar NEXT_PUBLIC_WS_URL.
      LIVE_WS_URL: ${LIVE_WS_URL:-}
      # API interna para los server components (lista/detalle de partidos).
      LIVE_API_INTERNAL_URL: ${LIVE_API_INTERNAL_URL:-http://ikodeportes-api:4000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-https://api.live.ikodeportes.com}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      TZ: "America/Caracas"
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  # Túnel propio del PC. Solo con `--profile tunnel`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ikodeportes-tunnel-cf
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - internal
    logging: *logging

networks:
  internal:
    driver: bridge

volumes:
  db_data:
